name: Public bundle checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run sync contract tests
        run: python -m unittest discover -s tests -v
      - name: Run review gate contract tests
        working-directory: skills/batch-complete-independent-review
        run: python -m unittest discover -s tests -v
      - name: Run supervisor PowerShell regressions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./skills/long-run-supervisor/tests/atomic-write-regression.ps1
          ./skills/long-run-supervisor/tests/smoke.ps1
      - name: Validate public hygiene and lock
        run: python scripts/public_sync.py validate
