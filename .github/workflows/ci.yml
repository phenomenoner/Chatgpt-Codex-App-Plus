name: Public bundle checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run sync contract tests
        run: python -m unittest discover -s tests -v
      - name: Validate public hygiene and lock
        run: python scripts/public_sync.py validate
