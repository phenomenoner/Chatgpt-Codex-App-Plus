# Public-safe starting point. Review every setting before copying it into your
# personal or project Codex configuration.

model_reasoning_effort = "high"
personality = "pragmatic"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"

[features]
# Memories remain experimental. Enable only after reviewing their data boundary.
memories = false

[agents]
enabled = true
# These defaults apply only when a spawn omits an explicit route. Leave them
# unset when Baton selects model and effort by task class.
# default_subagent_model = "gpt-5.6-luna"
# default_subagent_reasoning_effort = "max"

[windows]
sandbox = "elevated"

# Add MCP servers only from sources you trust. Never commit credentials.
# [mcp_servers.openaiDeveloperDocs]
# url = "https://developers.openai.com/mcp"
